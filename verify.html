<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Verify Email - Omnimun</title><style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#ededed;font-family:Arial;color:#111}.container{width:420px;background:#fff;padding:40px;border-radius:24px;box-shadow:0 20px 50px #0002}.logo{width:55px;height:55px;background:#111;color:#fff;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900}input,button{width:100%;padding:14px;margin-top:12px;border-radius:14px}input{border:1px solid #ccc}button{border:0;background:#111;color:#fff;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#ddd;color:#111}.message{margin-top:15px}.success{color:green}.error{color:red}.auth-logo{width:190px;max-width:100%;display:block;margin:0 0 22px}.auth-logo.small{width:170px}
</style></head><body><div class="container"><img src="logo-omnimun.jpg" alt="Omnimun logo" class="auth-logo small"><h1>Verify Email</h1><p>Enter the code sent to your Gmail.</p><div id="message" class="message" role="status"></div><label for="email">Email</label><input id="email" type="email" placeholder="your@gmail.com" required maxlength="5000"><button type="button" id="sendCode" class="secondary">Send Code Again</button><label for="code">Verification Code</label><input id="code" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"><button type="button" id="verify">Verify Email</button></div>
<script>
'use strict';
const $=id=>document.getElementById(id),send=$('sendCode'),verify=$('verify');let sending=false,verifying=false,until=0,tick=null;
try{$('email').value=new URLSearchParams(location.search).get('email')||localStorage.getItem('verifyEmail')||''}catch{}
function message(text,ok=false){$('message').className='message '+(ok?'success':'error');$('message').textContent=text}
function email(){if(!$('email').reportValidity())throw Error('Enter a valid email.');return $('email').value.trim().toLowerCase()}
async function post(url,body){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),60000);try{const res=await fetch(url,{method:'POST',credentials:'same-origin',signal:controller.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await res.json().catch(()=>{throw Error('Invalid server response')});if(!res.ok||!data.success)throw Error(data.error||'Request failed');return data}catch(e){throw Error(e.name==='AbortError'?'Request timed out. Please try again.':e.message)}finally{clearTimeout(timer)}}
function cooldown(){const seconds=Math.max(0,Math.ceil((until-Date.now())/1000));send.disabled=sending||seconds>0;send.textContent=seconds?'Resend available in '+seconds+'s':'Send Code Again';if(!seconds){clearInterval(tick);tick=null}}
send.onclick=async()=>{if(sending||Date.now()<until)return;sending=true;send.disabled=true;try{await post('/api/send-code',{email:email()});message('Verification code sent.',true);until=Date.now()+60000;clearInterval(tick);tick=setInterval(cooldown,250)}catch(e){message(e.message)}finally{sending=false;cooldown()}};
verify.onclick=async()=>{if(verifying)return;verifying=true;verify.disabled=true;try{const address=email(),code=$('code').value.trim();if(!/^\d{6}$/.test(code))throw Error('Enter the 6-digit verification code.');await post('/api/verify',{email:address,code});message('Email verified. Redirecting...',true);try{localStorage.removeItem('verifyEmail')}catch{}location.href='/login.html'}catch(e){message(e.message)}finally{verifying=false;verify.disabled=false}};
[$('email'),$('code')].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();if(!e.repeat)verify.click()}}));
</script></body></html>
