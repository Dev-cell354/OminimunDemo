<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Login - Omnimun</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#e8e8e8;font-family:Inter,Arial,sans-serif;color:#222}.container{width:420px;background:#f7f7f7;padding:42px;border-radius:24px;border:1px solid #d5d5d5;box-shadow:0 20px 50px #00000018}h1{margin:0 0 10px;font-size:32px;letter-spacing:-1px}p{color:#777;font-size:14px;margin-bottom:30px}label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}input{width:100%;padding:14px;border-radius:14px;border:1px solid #ccc;background:white;margin-bottom:18px;font-size:14px;outline:none}input:focus{border-color:#111}button{width:100%;padding:14px;border:0;border-radius:14px;background:#111;color:white;font-weight:700;cursor:pointer}button:hover{background:#000}#error{color:red;font-size:13px;margin-bottom:15px}.link{text-align:center;margin-top:22px;font-size:13px;color:#777}.link a{color:#111;font-weight:700;text-decoration:none}.brand{position:fixed;bottom:20px;right:25px;font-size:11px;letter-spacing:2px;color:#777;display:flex;align-items:center;gap:0!important}.auth-logo{width:132px;max-width:100%;max-height:38px;display:block;object-fit:contain;object-position:left center;margin:0 0 24px;mix-blend-mode:multiply}.google-btn{margin-top:10px;min-height:42px;padding:10px 14px;border:1px solid #d7d7d7;border-radius:12px;background:#fff;color:#222;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:none}.google-btn:hover{background:#f3f3f3}.google-btn img{width:18px;height:18px;flex:0 0 18px;object-fit:contain}
</style></head><body>
<div class="container"><img src="logo-omnimun.jpg" alt="Omnimun logo" class="auth-logo"><h1>Welcome Back</h1><p>Login to your Omnimun AI workspace.</p><div id="error" role="alert"></div><div id="verifyHint" style="color:#777;font-size:13px;margin-bottom:15px"></div><form id="loginForm"><label for="username">Username / Email</label><input id="username" type="text" placeholder="Enter username or email" autocomplete="username" maxlength="5000" required><label for="password">Password</label><input id="password" type="password" placeholder="Enter password" autocomplete="current-password" maxlength="5000" required><button type="submit">Sign In</button><button type="button" class="google-btn" id="google"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2.1H12v4h5.4a4.6 4.6 0 0 1-2 3v2.6h3.3c1.9-1.7 2.9-4.3 2.9-7.5z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.4L15.4 17c-.9.6-2 .9-3.4.9-2.6 0-4.8-1.8-5.6-4.2H3v2.6A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 13.7a6 6 0 0 1 0-3.4V7.7H3a10 10 0 0 0 0 8.6z"/><path fill="#EA4335" d="M12 6.1c1.5 0 2.8.5 3.8 1.5l2.9-2.9A9.6 9.6 0 0 0 12 2a10 10 0 0 0-9 5.7l3.4 2.6C7.2 7.9 9.4 6.1 12 6.1z"/></svg>Continue with Google</button></form><div class="link">Don't have an account? <a href="register.html">Create account</a></div></div><div class="brand">Made by Orthera</div>
<script>
'use strict';
const form=document.getElementById('loginForm'),error=document.getElementById('error'),submit=form.querySelector('[type=submit]');let busy=false;
document.getElementById('google').onclick=()=>location.href='/auth/google';
const password=document.getElementById('password'),toggle=document.createElement('button');toggle.type='button';toggle.textContent='Show';toggle.style.marginBottom='10px';toggle.onclick=()=>{password.type=password.type==='password'?'text':'password';toggle.textContent=password.type==='password'?'Show':'Hide'};password.after(toggle);
form.addEventListener('submit',async e=>{e.preventDefault();if(busy||!form.reportValidity())return;busy=true;submit.disabled=true;submit.textContent='Signing in...';error.textContent='';document.getElementById('verifyHint').replaceChildren();const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),60000);try{const res=await fetch('/api/login',{method:'POST',credentials:'same-origin',signal:controller.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:password.value})});const data=await res.json().catch(()=>{throw Error('Invalid server response')});if(!res.ok||!data.success)throw Error(data.error||'Login failed');location.href='/index.html'}catch(err){error.textContent=err.name==='AbortError'?'Request timed out. Please try again.':err.message;if(/verif/i.test(err.message)){const a=document.createElement('a');a.href='verify.html';a.textContent='Verify email';document.getElementById('verifyHint').append(a)}}finally{clearTimeout(timer);busy=false;submit.disabled=false;submit.textContent='Sign In';delete form.dataset.processing}});
</script></body></html>
