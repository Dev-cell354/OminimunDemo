<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Create Account - Omnimun</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#e8e8e8;font-family:Inter,Arial,sans-serif;color:#222}.container{width:420px;background:#fff;padding:42px;border-radius:24px;border:1px solid #ddd;box-shadow:0 20px 50px #00000018}h1{margin:0 0 10px;font-size:32px}p{color:#777;margin-bottom:30px}label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}input{width:100%;padding:14px;border-radius:14px;border:1px solid #ccc;margin-bottom:18px;font-size:14px;outline:none}input:focus{border-color:#000}button{width:100%;padding:14px;border:0;border-radius:14px;background:#000;color:#fff;font-weight:700;cursor:pointer}button:hover{opacity:.85}.link{text-align:center;margin-top:22px;font-size:13px;color:#777}.link a{color:#000;font-weight:700;text-decoration:none}.brand{position:fixed;bottom:20px;right:25px;font-size:11px;letter-spacing:2px;color:#777;display:flex;align-items:center;gap:0!important}#error{color:red;font-size:13px;margin-bottom:15px}.auth-logo{width:190px;max-width:100%;display:block;margin:0 0 22px}
</style></head><body><div class="container"><img src="logo-omnimun.jpg" alt="Omnimun logo" class="auth-logo"><h1>Create Account</h1><p>Join Omnimun AI workspace.</p><div id="error" role="alert"></div><form id="registerForm"><label for="username">Username</label><input id="username" type="text" placeholder="Enter username" autocomplete="username" maxlength="5000" required><label for="email">Email Gmail</label><input id="email" type="email" placeholder="your@gmail.com" autocomplete="email" maxlength="5000" required><label for="password">Password</label><input id="password" type="password" placeholder="Create password" autocomplete="new-password" maxlength="5000" required><label for="confirm">Confirm Password</label><input id="confirm" type="password" placeholder="Repeat password" autocomplete="new-password" maxlength="5000" required><button type="submit">Create Account</button></form><div class="link">Already have an account? <a href="login.html">Sign in</a></div></div><div class="brand">Made by Orthera</div>
<script>
'use strict';
const $=id=>document.getElementById(id),form=$('registerForm'),submit=form.querySelector('[type=submit]');let busy=false;
document.querySelectorAll('input[type=password]').forEach(input=>{const b=document.createElement('button');b.type='button';b.textContent='Show';b.style.marginBottom='10px';b.onclick=()=>{input.type=input.type==='password'?'text':'password';b.textContent=input.type==='password'?'Show':'Hide'};input.after(b)});
form.addEventListener('submit',async e=>{e.preventDefault();if(busy||!form.reportValidity())return;$('error').textContent='';const username=$('username').value.trim(),email=$('email').value.trim().toLowerCase(),password=$('password').value;let validation='';if(!/^[^@\s]+@gmail\.com$/.test(email))validation='Please use a Gmail address';else if(username.length<3)validation='Username minimal 3 karakter';else if(password.length<8)validation='Password minimal 8 karakter';else if(password!==$('confirm').value)validation='Passwords do not match';if(validation){$('error').textContent=validation;return}busy=true;submit.disabled=true;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),60000);try{const res=await fetch('/api/register',{method:'POST',credentials:'same-origin',signal:controller.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({username,email,password})}),data=await res.json().catch(()=>{throw Error('Invalid server response')});if(!res.ok||!data.success)throw Error(data.error||'Registration failed');try{localStorage.setItem('verifyEmail',email)}catch{}location.href='/verify.html?email='+encodeURIComponent(email)}catch(err){$('error').textContent=err.name==='AbortError'?'Request timed out. Please try again.':err.message}finally{clearTimeout(timer);busy=false;submit.disabled=false;delete form.dataset.processing}});
</script></body></html>
